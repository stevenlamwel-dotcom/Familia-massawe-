<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Familia Massawe — Uthibitisho wa Admin</title>
<style>
  :root {
    --green-dark: #0a4a2e; --green-mid: #1a7a4a; --green-light: #e8f5ee;
    --gold: #c9a84c; --gold-light: #f5e6b8; --text: #1a1a1a; --text-muted: #5a6a5a;
    --white: #ffffff; --border: #c8ddd0; --error: #c0392b; --radius: 12px;
    --shadow: 0 4px 24px rgba(10,74,46,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, var(--green-dark) 0%, #1a5c38 60%, var(--green-mid) 100%);
    min-height: 100vh; padding: 20px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; color: var(--white); padding: 10px 4px 20px; }
  .topbar h2 { font-size: 18px; font-weight: 700; }
  .logout-btn { background: rgba(255,255,255,0.15); color: var(--white); border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; }
  h3 { font-size: 15px; color: var(--green-dark); margin-bottom: 12px; }
  .person-name { font-weight: 700; font-size: 15px; color: var(--text); }
  .person-email { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
  select, input[type="text"] {
    width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; background: #fafffe;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .btn { padding: 10px 18px; background: linear-gradient(135deg, var(--green-dark), var(--green-mid)); color: var(--white); border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn:hover { opacity: 0.92; }
  .btn-reject { background: var(--white); color: var(--error); border: 1.5px solid var(--error); }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .msg { padding: 9px 13px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; display: none; }
  .msg.error { background: #fdecea; color: var(--error); border: 1px solid #f5c6c2; display: block; }
  .msg.success { background: var(--green-light); color: var(--green-dark); border: 1px solid #b0d8be; display: block; }
  .empty { color: var(--white); text-align: center; padding: 40px 0; opacity: 0.85; }
  .loading { color: var(--white); text-align: center; padding: 60px 0; }
  .denied { color: var(--white); text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Inapakia...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://euhteovuhdvefzaavlqx.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aHRlb3Z1aGR2ZWZ6YWF2bHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjQwNjEsImV4cCI6MjA5NzE0MDA2MX0.gaV1mShFhVHVpxAqCptJsiSr4r-d3_OYvdtH0bpR58Q';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let mtumiajiWaSasa = null;
  let woteApproved = [];

  async function pakiaKurasa() {
    const { data: sess } = await sb.auth.getSession();
    if (!sess.session) { window.location.href = 'login-5.html'; return; }
    mtumiajiWaSasa = sess.session.user;

    const { data: mwenyewe } = await sb.from('wanafamilia').select('ni_admin').eq('user_id', mtumiajiWaSasa.id).single();

    if (!mwenyewe || !mwenyewe.ni_admin) {
      document.getElementById('app').innerHTML = `
        <div class="topbar"><h2>🌳 Familia Massawe</h2><button class="logout-btn" onclick="ondoka()">Toka</button></div>
        <div class="denied">Ukurasa huu ni wa Admin pekee.</div>`;
      return;
    }

    const { data: pending } = await sb.from('wanafamilia').select('*').eq('hali_uthibitisho', 'pending').order('created_at');
    const { data: approved } = await sb.from('wanafamilia').select('id, jina').eq('hali_uthibitisho', 'approved').order('jina');
    woteApproved = approved || [];

    renderApp(pending || []);
  }

  function renderApp(pending) {
    const list = pending.length === 0
      ? `<div class="empty">Hakuna mtu anayesubiri uthibitisho kwa sasa.</div>`
      : pending.map(personCard).join('');

    document.getElementById('app').innerHTML = `
      <div class="topbar"><h2>🌳 Uthibitisho wa Wanafamilia</h2><button class="logout-btn" onclick="ondoka()">Toka</button></div>
      ${list}
    `;
  }

  function personCard(p) {
    const parentOptions = woteApproved.map(w => `<option value="${w.id}">${escHtml(w.jina)}</option>`).join('');
    return `
      <div class="card" id="card-${p.id}">
        <div class="msg" id="msg-${p.id}"></div>
        <div class="person-name">${escHtml(p.jina || '(Hana jina)')}</div>
        <div class="person-email">${escHtml(p.email || '')}</div>
        <div class="row">
          <div class="field">
            <label>Mzazi/Babu kwenye Mti</label>
            <select id="mzazi-${p.id}">
              <option value="">— Hakuna (ni Root mpya) —</option>
              ${parentOptions}
            </select>
          </div>
          <div class="field">
            <label>Jinsia</label>
            <select id="jinsia-${p.id}">
              <option value="M">Mwanaume</option>
              <option value="F">Mwanamke</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Fanya kuwa Admin pia?</label>
          <select id="admin-${p.id}">
            <option value="false">Hapana</option>
            <option value="true">Ndiyo</option>
          </select>
        </div>
        <div class="actions">
          <button class="btn" onclick="thibitisha(${p.id})">Thibitisha (Approve)</button>
          <button class="btn btn-reject" onclick="kataa(${p.id})">Kataa / Futa</button>
        </div>
      </div>`;
  }

  async function thibitisha(id) {
    const mzaziVal = document.getElementById('mzazi-'+id).value;
    const jinsia = document.getElementById('jinsia-'+id).value;
    const niAdmin = document.getElementById('admin-'+id).value === 'true';
    const msg = document.getElementById('msg-'+id);

    // Kizazi = kizazi cha mzazi + 1, au 1 kama ni root mpya
    let kizazi = 1;
    if (mzaziVal) {
      const { data: mzaziRekodi } = await sb.from('wanafamilia').select('kizazi').eq('id', mzaziVal).single();
      kizazi = (mzaziRekodi?.kizazi || 0) + 1;
    }

    const { error } = await sb.from('wanafamilia').update({
      hali_uthibitisho: 'approved',
      mzazi_id: mzaziVal ? parseInt(mzaziVal) : null,
      jinsia,
      ni_admin: niAdmin,
      kizazi
    }).eq('id', id);

    if (error) {
      msg.textContent = 'Imeshindikana: ' + error.message;
      msg.className = 'msg error';
    } else {
      document.getElementById('card-'+id).style.opacity = '0.4';
      msg.textContent = 'Amethibitishwa!';
      msg.className = 'msg success';
      setTimeout(() => document.getElementById('card-'+id)?.remove(), 900);
    }
  }

  async function kataa(id) {
    if (!confirm('Una hakika unataka kumfuta huyu? Hatua hii haiwezi kurudishwa.')) return;
    const { error } = await sb.from('wanafamilia').delete().eq('id', id);
    if (!error) document.getElementById('card-'+id)?.remove();
  }

  async function ondoka() {
    await sb.auth.signOut();
    window.location.href = 'login-5.html';
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  pakiaKurasa();
</script>
</body>
</html>
