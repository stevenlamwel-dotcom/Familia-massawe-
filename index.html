<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Familia Massawe — Ingia</title>
<style>
  :root {
    --green-dark: #0a4a2e;
    --green-mid: #1a7a4a;
    --green-light: #e8f5ee;
    --gold: #c9a84c;
    --gold-light: #f5e6b8;
    --text: #1a1a1a;
    --text-muted: #5a6a5a;
    --white: #ffffff;
    --border: #c8ddd0;
    --error: #c0392b;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(10,74,46,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, var(--green-dark) 0%, #1a5c38 60%, var(--green-mid) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }.card {
    background: var(--white);
    border-radius: 20px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
  }
  .card-header {
    background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
    padding: 32px 32px 28px;
    text-align: center;
  }
  .logo-circle {
    width: 70px; height: 70px;
    background: var(--gold);
    border-radius: 50%;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    box-shadow: 0 4px 16px rgba(201,168,76,0.35);
  }
  .card-header h1 { color: var(--white); font-size: 22px; font-weight: 700; }
  .card-header p { color: var(--gold-light); font-size: 13px; margin-top: 4px; opacity: 0.85; }
  .tabs { display: flex; border-bottom: 2px solid var(--green-light); }
  .tab {
    flex: 1; padding: 14px; text-align: center;
    font-size: 15px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; border: none; background: none;
    border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s;
  }
  .tab.active { color: var(--green-dark); border-bottom-color: var(--green-mid); }
  .tab:hover:not(.active) { background: var(--green-light); }
  .form-body { padding: 28px 32px 32px; }
  .form-panel { display: none; }
  .form-panel.active { display: block; }
  .field { margin-bottom: 18px; }
  label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--text-muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .input-wrap { position: relative; display: flex; align-items: center; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; padding: 12px 16px;
    border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 15px; color: var(--text); background: #fafffe;
    transition: border-color 0.2s, box-shadow 0.2s; outline: none;
  }
  input:focus {
    border-color: var(--green-mid);
    box-shadow: 0 0 0 3px rgba(26,122,74,0.12);
    background: var(--white);
  }
  .pw-input { padding-right: 48px !important; }
  .eye-btn {
    position: absolute; right: 14px;
    background: none; border: none; cursor: pointer;
    padding: 4px; color: var(--text-muted);
    display: flex; align-items: center; transition: color 0.2s;
  }
  .eye-btn:hover { color: var(--green-dark); }
  .eye-btn svg { width: 20px; height: 20px; display: block; }
  .strength-bar { display: flex; gap: 4px; margin-top: 8px; }
  .strength-seg { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background 0.3s; }
  .strength-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; min-height: 14px; }
  .btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
    color: var(--white); border: none; border-radius: var(--radius);
    font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px;
    letter-spacing: 0.5px; transition: opacity 0.2s, transform 0.1s;
  }
  .btn:hover { opacity: 0.92; }
  .btn:active { transform: scale(0.99); }
  .forgot { text-align: right; margin-top: -10px; margin-bottom: 16px; }
  .forgot a { font-size: 12px; color: var(--green-mid); text-decoration: none; }
  .msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .msg.error { background: #fdecea; color: var(--error); border: 1px solid #f5c6c2; display: block; }
  .msg.success { background: var(--green-light); color: var(--green-dark); border: 1px solid #b0d8be; display: block; }
  .footer-note { text-align: center; font-size: 12px; color: var(--text-muted); padding: 0 32px 20px; }
</style>
</head><body>
<div class="card">
  <div class="card-header">
    <div class="logo-circle">🌳</div>
    <h1>Familia Massawe</h1>
    <p>Mbokomu — Ukoo Wetu, Historia Yetu</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Ingia</button>
    <button class="tab" onclick="switchTab('signup')">Jisajili</button>
  </div>
  <div class="form-body">
    <div class="form-panel active" id="panel-login">
      <div id="login-msg" class="msg"></div>
      <div class="field">
        <label>Barua pepe</label>
        <div class="input-wrap">
          <input type="email" id="login-email" placeholder="mfano@gmail.com">
        </div>
      </div>
      <div class="field">
        <label>Nywila</label>
        <div class="input-wrap">
          <input type="password" id="login-pw" class="pw-input" placeholder="Ingiza nywila yako">
          <button class="eye-btn" type="button" onclick="togglePw('login-pw', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="forgot"><a href="#">Umesahau nywila?</a></div>
      <button class="btn" onclick="handleLogin()">Ingia kwenye Ukoo</button>
    </div>
    <div class="form-panel" id="panel-signup">
      <div id="signup-msg" class="msg"></div>
      <div class="field">
        <label>Jina Kamili</label>
        <div class="input-wrap">
          <input type="text" id="signup-name" placeholder="Jina lako kamili">
        </div>
      </div>
      <div class="field">
        <label>Barua pepe</label>
        <div class="input-wrap">
          <input type="email" id="signup-email" placeholder="mfano@gmail.com">
        </div>
      </div>
      <div class="field">
        <label>Nywila</label>
        <div class="input-wrap">
          <input type="password" id="signup-pw" class="pw-input" placeholder="Tengeneza nywila" oninput="checkStrength(this.value)">
          <button class="eye-btn" type="button" onclick="togglePw('signup-pw', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="strength-bar">
          <div class="strength-seg" id="s1"></div>
          <div class="strength-seg" id="s2"></div>
          <div class="strength-seg" id="s3"></div>
          <div class="strength-seg" id="s4"></div>
        </div>
        <div class="strength-label" id="strength-label"></div>
      </div>
      <div class="field">
        <label>Thibitisha Nywila</label>
        <div class="input-wrap">
          <input type="password" id="signup-pw2" class="pw-input" placeholder="Rudia nywila yako">
          <button class="eye-btn" type="button" onclick="togglePw('signup-pw2', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn" onclick="handleSignup()">Jiunge na Familia</button>
    </div>
  </div>
  <div class="footer-note">Familia Massawe Mbokomu &copy; 2025</div>
</div>
<script>
  const SUPABASE_URL = 'https://euhteovuhdvefzaavlqx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aHRlb3Z1aGR2ZWZ6YWF2bHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjQwNjEsImV4cCI6MjA5NzE0MDA2MX0.gaV1mShFhVHVpxAqCptJsiSr4r-d3_OYvdtH0bpR58Q';

  function sbFetch(path, body) {
    return fetch(SUPABASE_URL + path, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify(body)
    }).then(r => r.json());
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'?0:1)===i));
    document.getElementById('panel-login').classList.toggle('active', tab==='login');
    document.getElementById('panel-signup').classList.toggle('active', tab==='signup');
  }

  const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

  function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    btn.querySelector('svg').innerHTML = showing ? eyeOpen : eyeClosed;
  }

  function checkStrength(pw) {
    let score = 0;
    if (pw.length >= 6) score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/[0-9]/.test(pw) || /[^a-zA-Z0-9]/.test(pw)) score++;
    const colors = ['#e74c3c','#e67e22','#f1c40f','#27ae60'];
    const labels = ['Dhaifu sana','Dhaifu','Nzuri','Imara sana 💪'];
    for (let i = 1; i <= 4; i++) {
      document.getElementById('s'+i).style.background = i <= score ? colors[score-1] : 'var(--border)';
    }
    document.getElementById('strength-label').textContent = pw.length > 0 ? labels[score-1] : '';
    document.getElementById('strength-label').style.color = score > 0 ? colors[score-1] : 'var(--text-muted)';
  }

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pw').value;
    const msg = document.getElementById('login-msg');
    msg.className = 'msg';
    if (!email || !password) {
      msg.textContent = 'Tafadhali jaza barua pepe na nywila.';
      msg.className = 'msg error'; return;
    }
    try {
      const data = await sbFetch('/auth/v1/token?grant_type=password', { email, password });
      if (data.access_token) {
        localStorage.setItem('sb_token', data.access_token);
        localStorage.setItem('sb_user', JSON.stringify(data.user));
        msg.textContent = 'Umeingia! Unakwenda kwenye ukurasa wako...';
        msg.className = 'msg success';
        setTimeout(() => window.location.href = 'profile.html', 1200);
      } else {
        msg.textContent = data.error_description || 'Barua pepe au nywila si sahihi.';
        msg.className = 'msg error';
      }
    } catch(e) {
      msg.textContent = 'Hitilafu ya mtandao. Jaribu tena.';
      msg.className = 'msg error';
    }
  }

  async function handleSignup() {
    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pw = document.getElementById('signup-pw').value;
    const pw2 = document.getElementById('signup-pw2').value;
    const msg = document.getElementById('signup-msg');
    msg.className = 'msg';
    if (!name || !email || !pw) {
      msg.textContent = 'Tafadhali jaza taarifa zote.';
      msg.className = 'msg error'; return;
    }
    if (pw !== pw2) {
      msg.textContent = 'Nywila mbili hazifanani.';
      msg.className = 'msg error'; return;
    }
    if (pw.length < 6) {
      msg.textContent = 'Nywila iwe na herufi 6 au zaidi.';
      msg.className = 'msg error'; return;
    }
    try {
      const data = await sbFetch('/auth/v1/signup', {
        email, password: pw,
        data: { full_name: name }
      });
      if (data.id || data.user?.id) {
        msg.textContent = 'Umesajiliwa! Angalia barua pepe yako kuthibitisha akaunti.';
        msg.className = 'msg success';
      } else {
        msg.textContent = data.error_description || data.msg || 'Tatizo la kusajili. Jaribu tena.';
        msg.className = 'msg error';
      }
    } catch(e) {
      msg.textContent = 'Hitilafu ya mtandao. Jaribu tena.';
      msg.className = 'msg error';
    }
  }
</script>
</body>
</html>
