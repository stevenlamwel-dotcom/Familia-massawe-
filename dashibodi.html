<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Familia Massawe — Dashibodi</title>
<style>
  :root {
    --green-dark: #0a4a2e;
    --green-mid: #1a7a4a;
    --green-light: #e8f5ee;
    --gold: #c9a84c;
    --gold-light: #f5e6b8;
    --text: #1a1a1a;
    --text-muted: #5a6a5a;
    --white: #ffffff;
    --border: #c8ddd0;
    --error: #c0392b;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(10,74,46,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, var(--green-dark) 0%, #1a5c38 60%, var(--green-mid) 100%);
    min-height: 100vh;
    padding: 20px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--white); padding: 10px 4px 20px;
  }
  .topbar h2 { font-size: 18px; font-weight: 700; }
  .logout-btn {
    background: rgba(255,255,255,0.15); color: var(--white); border: 1px solid rgba(255,255,255,0.3);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.25); }

  .card {
    background: var(--white);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 28px;
    margin-bottom: 20px;
  }

  .pending-banner {
    background: var(--gold-light);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 20px;
    color: #6b5520;
    font-size: 14px;
    line-height: 1.5;
  }
  .pending-banner strong { display: block; margin-bottom: 4px; color: var(--green-dark); font-size: 15px; }

  .approved-banner {
    background: var(--green-light);
    border: 1px solid #b0d8be;
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 20px;
    color: var(--green-dark);
    font-size: 14px;
  }

  h3 { font-size: 15px; color: var(--green-dark); margin-bottom: 14px; }

  .field { margin-bottom: 16px; }
  label {
    display: block; font-size: 12px; font-weight: 600; color: var(--text-muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"], input[type="tel"], input[type="password"], input[type="date"], textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: var(--radius); font-size: 14px; color: var(--text);
    background: #fafffe; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--green-mid); }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }

  .btn {
    padding: 12px 22px; background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
    color: var(--white); border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn:hover { opacity: 0.92; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .msg.error { background: #fdecea; color: var(--error); border: 1px solid #f5c6c2; display: block; }
  .msg.success { background: var(--green-light); color: var(--green-dark); border: 1px solid #b0d8be; display: block; }

  .loading { color: var(--white); text-align: center; padding: 60px 0; }
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading">Inapakia...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://euhteovuhdvefzaavlqx.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aHRlb3Z1aGR2ZWZ6YWF2bHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjQwNjEsImV4cCI6MjA5NzE0MDA2MX0.gaV1mShFhVHVpxAqCptJsiSr4r-d3_OYvdtH0bpR58Q';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let mtumiajiWaSasa = null;
  let rekodiYangu = null;

  async function pakiaKurasa() {
    const { data: sess } = await sb.auth.getSession();
    if (!sess.session) { window.location.href = 'login-5.html'; return; }
    mtumiajiWaSasa = sess.session.user;

    const { data: rekodi, error } = await sb
      .from('wanafamilia')
      .select('*')
      .eq('user_id', mtumiajiWaSasa.id)
      .single();

    if (error || !rekodi) {
      renderHitilafu();
      return;
    }
    rekodiYangu = rekodi;

    if (rekodi.hali_uthibitisho === 'approved') {
      renderApproved(rekodi);
    } else {
      renderPending(rekodi);
    }
  }

  function topbar() {
    return `
      <div class="topbar">
        <h2>🌳 Familia Massawe</h2>
        <button class="logout-btn" onclick="ondoka()">Toka</button>
      </div>`;
  }

  function renderPending(rekodi) {
    document.getElementById('app').innerHTML = `
      ${topbar()}
      <div class="pending-banner">
        <strong>Unasubiri uthibitisho wa Admin</strong>
        Karibu kwenye Familia Massawe, ${escHtml(rekodi.jina || '')}! Akaunti yako imeundwa,
        lakini bado unasubiri Admin kukuweka mahali pako kwenye mti wa ukoo na kukuruhusu
        kutumia sehemu zote za app. Wakati huu, unaweza kukamilisha taarifa zako hapa chini.
      </div>
      ${profileForm(rekodi)}
      ${passwordForm()}
    `;
    wireProfileForm();
    wirePasswordForm();
  }

  function renderApproved(rekodi) {
    document.getElementById('app').innerHTML = `
      ${topbar()}
      <div class="approved-banner">
        Karibu tena, ${escHtml(rekodi.jina || '')}! Akaunti yako imethibitishwa
        ${rekodi.ni_admin ? '— wewe ni <strong>Admin</strong> wa ukoo.' : ''}
      </div>
      ${profileForm(rekodi)}
      ${passwordForm()}
      <div class="card">
        <h3>Hatua inayofuata</h3>
        <p style="font-size:14px; color:var(--text-muted); line-height:1.6;">
          Ukurasa wa mti wa ukoo na sehemu nyingine (matangazo, historia, picha) bado
          unajengwa. Kwa sasa unaweza kuhariri taarifa zako hapa juu.
        </p>
      </div>
    `;
    wireProfileForm();
    wirePasswordForm();
  }

  function renderHitilafu() {
    document.getElementById('app').innerHTML = `
      ${topbar()}
      <div class="card">
        <div class="msg error" style="display:block;">
          Hatukupata rekodi yako ya mwanafamilia. Wasiliana na Admin.
        </div>
      </div>`;
  }

  function profileForm(rekodi) {
    return `
      <div class="card">
        <h3>Taarifa Zangu</h3>
        <div id="profile-msg" class="msg"></div>
        <div class="field">
          <label>Jina Kamili</label>
          <input type="text" id="f-jina" value="${escAttr(rekodi.jina || '')}">
        </div>
        <div class="field">
          <label>Simu</label>
          <input type="tel" id="f-simu" value="${escAttr(rekodi.simu || '')}" placeholder="+255...">
        </div>
        <div class="field">
          <label>Makazi</label>
          <input type="text" id="f-makazi" value="${escAttr(rekodi.makazi || '')}" placeholder="Mji unaoishi">
        </div>
        <div class="field">
          <label>Kazi</label>
          <input type="text" id="f-kazi" value="${escAttr(rekodi.kazi || '')}">
        </div>
        <div class="field">
          <label>Tarehe ya Kuzaliwa</label>
          <input type="date" id="f-dob" value="${rekodi.tarehe_kuzaliwa || ''}">
        </div>
        <div class="field">
          <label>Maelezo Mafupi</label>
          <textarea id="f-maelezo">${escHtml(rekodi.maelezo || '')}</textarea>
        </div>
        <button class="btn" onclick="hifadhiProfile()">Hifadhi Taarifa</button>
      </div>`;
  }

  function passwordForm() {
    return `
      <div class="card">
        <h3>Badilisha Nywila</h3>
        <div id="pw-msg" class="msg"></div>
        <div class="field">
          <label>Nywila Mpya</label>
          <input type="password" id="pw-new" placeholder="Herufi 6 au zaidi">
        </div>
        <div class="field">
          <label>Thibitisha Nywila Mpya</label>
          <input type="password" id="pw-new2">
        </div>
        <button class="btn" onclick="badilishaNywila()">Badilisha Nywila</button>
      </div>`;
  }

  function wireProfileForm() {}
  function wirePasswordForm() {}

  async function hifadhiProfile() {
    const msg = document.getElementById('profile-msg');
    msg.className = 'msg';
    const updates = {
      jina: document.getElementById('f-jina').value.trim(),
      simu: document.getElementById('f-simu').value.trim() || null,
      makazi: document.getElementById('f-makazi').value.trim() || null,
      kazi: document.getElementById('f-kazi').value.trim() || null,
      tarehe_kuzaliwa: document.getElementById('f-dob').value || null,
      maelezo: document.getElementById('f-maelezo').value.trim() || null
    };
    const { error } = await sb.from('wanafamilia').update(updates).eq('user_id', mtumiajiWaSasa.id);
    if (error) {
      msg.textContent = 'Imeshindikana: ' + error.message;
      msg.className = 'msg error';
    } else {
      msg.textContent = 'Taarifa zimehifadhiwa.';
      msg.className = 'msg success';
    }
  }

  async function badilishaNywila() {
    const pw = document.getElementById('pw-new').value;
    const pw2 = document.getElementById('pw-new2').value;
    const msg = document.getElementById('pw-msg');
    msg.className = 'msg';

    if (pw.length < 6) {
      msg.textContent = 'Nywila iwe na herufi 6 au zaidi.';
      msg.className = 'msg error'; return;
    }
    if (pw !== pw2) {
      msg.textContent = 'Nywila mbili hazifanani.';
      msg.className = 'msg error'; return;
    }

    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) {
      msg.textContent = 'Imeshindikana: ' + error.message;
      msg.className = 'msg error';
    } else {
      msg.textContent = 'Nywila imebadilishwa.';
      msg.className = 'msg success';
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-new2').value = '';
    }
  }

  async function ondoka() {
    await sb.auth.signOut();
    window.location.href = 'login-5.html';
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escAttr(s) { return escHtml(s); }

  pakiaKurasa();
</script>
</body>
</html>
